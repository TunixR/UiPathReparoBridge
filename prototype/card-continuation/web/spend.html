<!doctype html>
<!-- PROTOTYPE for ReparoHome#66: SpendApp's request 104 as a web page. Approve is missing for 6 s after each load,
     so a browser that closes and reopens (or reloads) shows the failed screen again. -->
<html><head><meta charset="utf-8"><title>Spend web</title></head>
<body style="font: 18px Segoe UI">
<h1>Request 104</h1>
<p>Amount: <span id="amount">300</span></p>
<p id="actions"></p>
<p>Status: <span id="status">Pending</span></p>
<p>Loaded at <span id="loaded"></span></p>
<script>
  document.getElementById('loaded').textContent = new Date().toISOString();
  setTimeout(() => {
    const b = document.createElement('button');
    b.id = 'approve'; b.textContent = 'Approve';
    b.onclick = () => document.getElementById('status').textContent = 'Approved';
    document.getElementById('actions').appendChild(b);
  }, 6000);
</script>
</body></html>
